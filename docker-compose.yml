services:

  # The service to expose one synchronized file over the internet
  secretfile:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: secretfile

    ports:
      - "8809:8000"

    env_file:
      - .env

    # Optional: only needed if PROTECTED_FILE points to a host file
    volumes:
      - /home/rflec028/SyncRoot/scripts/export:/data/export:ro

    restart: unless-stopped
    
