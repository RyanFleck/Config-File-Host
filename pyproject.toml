[project]
name = "config-file-host"
version = "0.1.0"
description = "Secure hosting of a single file from the filesystem."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "gunicorn>=26.0.0",
    "python-dotenv>=1.2.2",
    "werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
pythonpath = "."

[tool.pytest_env]
DOWNLOAD_PATH = "shared-config"
DOWNLOAD_KEY = "secret-password"
PROTECTED_FILE = "tests/data/info.txt"
